name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -W clippy::pedantic -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      # Headless: catches broken example scripts without a compositor.
      - name: Check example scripts
        run: |
          for script in scripts/*.rhai; do
            ./target/debug/wl-party check "$script"
          done

  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix build -L
